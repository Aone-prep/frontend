name: Frontend build

on:
  push:
    branches:
      - dev

env:
  DOCKER_IMAGE: stalinrijal/aone-prep
  DOCKER_TAG: frontend-${{ github.run_number }}

# Add permissions block at the workflow level
permissions:
  contents: read
  actions: write    # This is required to trigger other workflows

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Login to Docker Hub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Verify Docker Hub login
        run: docker info

      - name: Build and push Docker image
        id: docker_build
        uses: docker/build-push-action@v2
        with:
          context: .
          push: true
          tags: ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }}

      - name: Output image digest
        run: 'echo "Image Digest: ${{ steps.docker_build.outputs.digest }}"'

      - name: Prune old images (keep only 5 latest)
        run: |
          echo "Pruning images to keep only the 5 latest..."
          docker image prune -f --filter "until=240h"
          docker images --filter "dangling=false" --format "{{.Repository}}:{{.Tag}}" | head -n -5 | xargs docker rmi -f
      
      - name: Trigger Deployment Pipeline
        if: success()
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.AONEPREP_GITHUB_TOKEN }}  # Use a PAT with necessary permissions
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'frontend-deploy.yml',
              ref: context.ref,
              inputs: {
                docker_tag: '${{ env.DOCKER_TAG }}'
              }
            });