name: Frontend build

on:
  push:
    branches:
      - dev

env:
  DOCKER_IMAGE: stalinrijal/aone-prep
  DOCKER_TAG: frontend-${{ github.run_number }}

permissions:
  contents: read
  actions: write    # This is required to trigger other workflows

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Login to Docker Hub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Verify Docker Hub login
        run: docker info

      - name: Build Docker image
        id: docker_build
        uses: docker/build-push-action@v2
        with:
          context: .
          push: false  # Don't push yet, we'll scan first
          tags: ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }}
          load: true   # Load the image locally for scanning

      - name: Scan local image for vulnerabilities
        continue-on-error: true  # Continue even if vulnerabilities are found
        run: |
          # Install Trivy
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin v0.18.3
          # Scan the local image
          trivy image --exit-code 1 --severity HIGH,CRITICAL ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }}

      - name: Push Docker image
        if: success() || failure()  # Push even if scan finds vulnerabilities
        run: |
          docker push ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }}

      - name: Scan Docker Hub image
        continue-on-error: true
        run: |
          # Scan the pushed image
          trivy image --exit-code 0 --security-checks vuln ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }}

      - name: Output image digest
        run: 'echo "Image Digest: ${{ steps.docker_build.outputs.digest }}"'

      - name: Prune old images (keep only 5 latest)
        run: |
          echo "Pruning images to keep only the 5 latest..."
          docker image prune -f --filter "until=240h"
          docker images --filter "dangling=false" --format "{{.Repository}}:{{.Tag}}" | head -n -5 | xargs docker rmi -f
      
      - name: Trigger Deployment Pipeline
        if: success()
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.AONEPREP_GITHUB_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'frontend-deploy.yml',
              ref: context.ref,
              inputs: {
                DOCKER_TAG: '${{ env.DOCKER_TAG }}'
              }
            });