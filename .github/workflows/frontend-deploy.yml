name: Docker Build and Push

on:
  push:
    branches:
      - dev

env:
  DOCKER_IMAGE: stalinrijal/aone-prep
  DOCKER_TAG: frontend-${{ github.run_number }}

jobs:
  build-test-and-push:
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Login to Docker Hub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Verify Docker Hub login
        run: docker info

      - name: Build and push Docker image
        id: docker_build
        uses: docker/build-push-action@v2
        with:
          context: .
          push: false  # Don't push yet, we'll push after testing
          load: true   # Load the image locally for testing
          tags: ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }}

      - name: Run Unit Tests
        run: |
          # Pull the built image
          docker pull ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }}
          
          # Run the container with test command
          docker run --rm ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }} npm test

      - name: Push Image if Tests Pass
        if: success()
        uses: docker/build-push-action@v2
        with:
          context: .
          push: true
          tags: ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }}

      - name: Output image digest
        run: 'echo "Image Digest: ${{ steps.docker_build.outputs.digest }}"'

      - name: Prune old images (keep only 5 latest)
        run: |
          echo "Pruning images to keep only the 5 latest..."
          docker image prune -f --filter "until=240h"
          docker images --filter "dangling=false" --format "{{.Repository}}:{{.Tag}}" | head -n -5 | xargs docker rmi -f

      - name: Notify on Failure
        if: failure()
        run: |
          echo "::error::Docker build, test, or push failed!"