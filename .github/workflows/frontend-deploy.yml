name: Docker Build and Push

on:
  push:
    branches:
      - dev  # This will run the workflow on pushes to the dev branch

env:
  DOCKER_IMAGE: stalinrijal/aone-prep
  DOCKER_TAG: ${{ github.run_number }}  # Use build number for tagging

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: dev  # Specify the environment to use secrets from "dev"

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Login to Docker Hub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Verify Docker Hub login
        run: docker info

      - name: Build and push Docker image
        id: docker_build
        uses: docker/build-push-action@v2
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }}  # Use build number for tagging

      - name: Output image digest
        run: 'echo "Image Digest: ${{ steps.docker_build.outputs.digest }}"'

      - name: Prune old images (keep only 5 latest)
        run: |
          echo "Pruning images to keep only the 5 latest..."
          docker image prune -f --filter "until=240h"  # Removes images older than 10 days (240 hours)
          docker images --filter "dangling=false" --format "{{.Repository}}:{{.Tag}}" | head -n -5 | xargs docker rmi -f
